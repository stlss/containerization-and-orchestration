alloy:
  fullnameOverride: alloy
  crds:
    create: false
  controller:
    type: daemonset
  alloy:
    configMap:
      create: false
      name: lab2-alloy-config
      key: config.alloy
    extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
