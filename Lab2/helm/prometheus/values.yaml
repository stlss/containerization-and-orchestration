prometheus:
  configmapReload:
    prometheus:
      extraVolumeDirs:
      - /etc/alerts
      extraConfigmapMounts:
      - name: lab-api-alerts
        configMap: lab-api-alerts
        mountPath: /etc/alerts
        readOnly: true
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    fullnameOverride: prometheus
    alertmanagers:
    - static_configs:
      - targets:
        - alertmanager:9093
    extraConfigmapMounts:
    - name: lab-api-alerts
      configMap: lab-api-alerts
      mountPath: /etc/alerts
      readOnly: true
    global:
      scrape_interval: 5s
      scrape_timeout: 4s
      evaluation_interval: 5s
    retention: 2d
    persistentVolume:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 512Mi
  serverFiles:
    prometheus.yml:
      rule_files:
      - /etc/alerts/*.yaml
  scrapeConfigs:
    prometheus:
      enabled: true
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    kubernetes-services:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
    lab-api:
      metrics_path: /metrics
      static_configs:
      - targets:
        - lab-api.lab2.svc.cluster.local:8080
  alertmanager:
    enabled: false
