apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-webhook
data:
  webhook.py: |
    {{- .Files.Get "config/webhook.py" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook
  template:
    metadata:
      annotations:
        checksum/config: {{ .Files.Get "config/webhook.py" | sha256sum }}
      labels:
        app: alert-webhook
    spec:
      containers:
        - name: receiver
          image: {{ .Values.webhook.image | quote }}
          command: [python, /app/webhook.py]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: alert-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
spec:
  selector:
    app: alert-webhook
  ports:
    - name: http
      port: 8080
      targetPort: http
