grafana:
  fullnameOverride: grafana
  adminUser: admin
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus
        jsonData:
          timeInterval: 5s
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id"\s*:\s*"([0-9a-f]{32})"'
            datasourceUid: jaeger
            url: $${__value.raw}
            urlDisplayLabel: View trace
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: lab2
        orgId: 1
        folder: Lab 2
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/lab2
  dashboardsConfigMaps:
    lab2: lab2-red-dashboard
